<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkyCube — Infinite Flight</title>
<style>
/* styles.css — SkyCube UI */

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden;
  background: #89a7c4;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  overscroll-behavior: none;
}

#glcanvas {
  position: fixed; inset: 0;
  display: block; width: 100%; height: 100%;
  touch-action: none;
}

#hud {
  position: fixed;
  left: 16px; top: 16px;
  color: #f2f7ff; font-size: 12px; line-height: 1.55;
  text-shadow: 0 1px 4px rgba(0,0,0,.85);
  pointer-events: none; opacity: .88;
  padding-left: env(safe-area-inset-left);
  padding-top: env(safe-area-inset-top);
}
#hud b { color: #ffd479; }

#stats {
  position: fixed;
  right: 16px; top: 16px;
  color: #f2f7ff; font-size: 12px; text-align: right;
  text-shadow: 0 1px 4px rgba(0,0,0,.85);
  pointer-events: none; opacity: .88;
  padding-right: env(safe-area-inset-right);
  padding-top: env(safe-area-inset-top);
}

#msg {
  position: fixed;
  left: 50%; top: 42%;
  transform: translate(-50%,-50%);
  color: #fff; font-size: 30px; letter-spacing: 4px; font-weight: 700;
  text-shadow: 0 3px 18px rgba(0,0,0,.9);
  pointer-events: none; opacity: 0;
  transition: opacity .25s;
  font-family: system-ui, sans-serif;
}

#crosshair {
  position: fixed;
  left: 50%; top: 50%;
  width: 22px; height: 22px;
  margin: -11px 0 0 -11px;
  pointer-events: none; opacity: .3;
}
#crosshair:before, #crosshair:after {
  content: ''; position: absolute; background: #fff;
  box-shadow: 0 0 3px #000;
}
#crosshair:before { left: 10px; top: 0; width: 2px; height: 22px; }
#crosshair:after  { left: 0; top: 10px; width: 22px; height: 2px; }

/* ---------- Touch UI ---------- */
#touchUI { display: none; }

.stick {
  position: fixed;
  width: 150px; height: 150px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,.35);
  background: rgba(255,255,255,.07);
  bottom: calc(28px + env(safe-area-inset-bottom));
  touch-action: none;
  pointer-events: none;
}
#leftStick  { left:  calc(28px + env(safe-area-inset-left)); }
#rightStick { right: calc(28px + env(safe-area-inset-right)); }

.knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 62px; height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  background: rgba(255,255,255,.55);
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 2px 10px rgba(0,0,0,.4);
  pointer-events: none;
  will-change: transform;
}

.stickLabel {
  position: absolute; left: 50%; bottom: -22px;
  transform: translateX(-50%);
  color: #fff; font-size: 11px; letter-spacing: 1px;
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
  white-space: nowrap; opacity: .78;
}

#resetBtn {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right));
  top: calc(90px + env(safe-area-inset-top));
  padding: 8px 14px;
  font: inherit; font-size: 12px; letter-spacing: 1px;
  color: #fff; background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 8px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: none;
}

</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="crosshair"></div>
<div id="hud">
  <div id="hudKeys"><b>W/S</b> pitch &nbsp; <b>A/D</b> roll &nbsp; <b>Q/E</b> rudder</div>
  <div id="hudKeys2"><b>SHIFT/CTRL</b> throttle &nbsp; <b>R</b> respawn &nbsp; <b>O</b> outlines</div>
</div>
<div id="stats"></div>
<div id="msg"></div>

<div id="touchUI">
  <div class="stick" id="leftStick">
    <div class="knob" id="leftKnob"></div>
    <div class="stickLabel">PITCH / ROLL</div>
  </div>
  <div class="stick" id="rightStick">
    <div class="knob" id="rightKnob"></div>
    <div class="stickLabel">THROTTLE / YAW</div>
  </div>
</div>
<button id="resetBtn">RESPAWN</button>

<script src="models.js"></script>
<script src="graphics.js"></script>
</body>
</html>
