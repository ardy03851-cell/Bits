<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SkyCube — Infinite Flight</title>
<style>
/* =========================================================================
   SkyCube UI — index.html only provides a canvas and the CSS design system.
   graphics.js builds every UI element dynamically. Every UI texture is
   optional; when a texture is missing the fallback styles below take over.

   Style: flat, low-contrast, no glows. White on a dark scrim so it stays
   readable over sky without shouting.
   ========================================================================= */

:root {
  /* Layout */
  --stick-size:      140px;
  --stick-margin:    24px;
  --ui-gap:          12px;
  --throttle-w:      56px;
  --throttle-h:      170px;
  --throttle-top:    32px;

  /* Safe areas */
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  /* Palette */
  --panel:  rgba(0, 0, 0, 0.35);
  --line:   rgba(255, 255, 255, 0.25);
  --line-2: rgba(255, 255, 255, 0.55);
  --text:   #ffffff;
  --muted:  rgba(255, 255, 255, 0.7);

  /* UI texture slots — set by JS when a file loads. */
  --ui-stick-base:              none;
  --ui-stick-base-active:       none;
  --ui-stick-knob:              none;
  --ui-stick-knob-active:       none;
  --ui-throttle-track:          none;
  --ui-throttle-fill:           none;
  --ui-throttle-handle:         none;
  --ui-throttle-handle-active:  none;
  --ui-throttle-frame:          none;
  --ui-throttle-label:          none;
  --ui-crosshair:               none;
  --ui-hud-panel:               none;
  --ui-hud-corner:              none;
  --ui-btn-frame:               none;
  --ui-btn-frame-active:        none;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  overflow: hidden;
  background: #89a7c4;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
  overscroll-behavior: none;
}

#glcanvas {
  position: fixed; inset: 0;
  display: block;
  width: 100%; height: 100%;
  touch-action: none;
}

/* =========================================================================
   HUD — stats, key hints, biome readout
   ========================================================================= */
.hud-panel {
  padding: 8px 12px;
  border-radius: 6px;
  background-color: var(--panel);
  background-image: var(--ui-hud-panel, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  pointer-events: none;
}

.hud-panel.textured {
  border-color: transparent;
  background-color: transparent;
  text-shadow: none;
}

#hud {
  position: fixed;
  left: calc(16px + var(--safe-l));
  top: calc(16px + var(--safe-t));
}

#hud b { color: var(--text); font-weight: 600; }

#stats {
  position: fixed;
  right: calc(16px + var(--safe-r));
  top: calc(16px + var(--safe-t));
  text-align: right;
  white-space: nowrap;
}

#stats b { color: var(--text); font-weight: 600; }

body.is-touch #hudKeys,
body.is-touch #hudKeys2 { display: none; }

/* =========================================================================
   CROSSHAIR
   ========================================================================= */
#crosshair {
  position: fixed;
  left: 50%; top: 50%;
  width: 18px; height: 18px;
  margin: -9px 0 0 -9px;
  pointer-events: none;
  opacity: 0.5;
}
#crosshair::before,
#crosshair::after {
  content: '';
  position: absolute;
  background: #fff;
}
#crosshair::before { left: 8px; top: 0; width: 1px; height: 18px; }
#crosshair::after  { left: 0; top: 8px; width: 18px; height: 1px; }

#crosshair.textured {
  width: 40px; height: 40px;
  margin: -20px 0 0 -20px;
  background-image: var(--ui-crosshair);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.7;
}
#crosshair.textured::before,
#crosshair.textured::after { display: none; }

/* =========================================================================
   CENTER MESSAGE
   ========================================================================= */
#msg {
  position: fixed;
  left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}

/* =========================================================================
   TOUCH UI — sticks + throttle
   ========================================================================= */
#touchUI { display: none; }
body.is-touch #touchUI { display: block; }
body.is-touch #resetBtn { display: block; }

/* ---- Sticks ---- */
.stick {
  position: fixed;
  width: var(--stick-size);
  height: var(--stick-size);
  pointer-events: none;
  z-index: 10;
}
#leftStick {
  left:   calc(var(--stick-margin) + var(--safe-l));
  bottom: calc(var(--stick-margin) + var(--safe-b));
}
#rightStick {
  right:  calc(var(--stick-margin) + var(--safe-r));
  bottom: calc(var(--stick-margin) + var(--safe-b));
}

.stick-base {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background-color: rgba(0, 0, 0, 0.15);
  background-image: var(--ui-stick-base, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  transition: border-color 0.15s, background-color 0.15s;
}

.stick.active .stick-base {
  border-color: var(--line-2);
  background-color: rgba(0, 0, 0, 0.25);
  background-image: var(--ui-stick-base-active, var(--ui-stick-base, none));
}

.knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 54px; height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  background-color: rgba(255, 255, 255, 0.8);
  background-image: var(--ui-stick-knob, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  will-change: transform;
  pointer-events: none;
  transition: background-color 0.15s;
}
.stick.active .knob {
  background-color: rgba(255, 255, 255, 1);
  background-image: var(--ui-stick-knob-active, var(--ui-stick-knob, none));
}

.stickLabel {
  position: absolute;
  left: 50%; bottom: -20px;
  transform: translateX(-50%);
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
}

/* ---- Throttle ---- */
#throttle {
  position: fixed;
  right: calc(
    var(--stick-margin) + var(--safe-r)
    + (var(--stick-size) - var(--throttle-w)) / 2
  );
  bottom: calc(
    var(--stick-margin) + var(--safe-b)
    + var(--stick-size) + var(--ui-gap)
  );
  width: var(--throttle-w);
  height: var(--throttle-h);
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  z-index: 11;
}

.throttle-track {
  position: absolute;
  left: 50%;
  top: var(--throttle-top);
  bottom: 0;
  width: 8px;
  margin-left: -4px;
  border-radius: 4px;
  background-color: rgba(0, 0, 0, 0.4);
  background-image: var(--ui-throttle-track, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  border: 1px solid var(--line);
}

.throttle-fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0%;
  border-radius: 4px;
  background-color: rgba(255, 255, 255, 0.85);
  background-image: var(--ui-throttle-fill, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
}

.throttle-handle {
  position: absolute;
  left: 50%;
  bottom: 0%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, 50%);
  border-radius: 50%;
  background-color: #fff;
  background-image: var(--ui-throttle-handle, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
  will-change: bottom;
}
#throttle.active .throttle-handle {
  background-image: var(--ui-throttle-handle-active, var(--ui-throttle-handle, none));
}

.throttle-frame {
  position: absolute;
  left: 50%;
  top: calc(var(--throttle-top) - 12px);
  bottom: -14px;
  width: calc(var(--throttle-w) + 16px);
  margin-left: calc((var(--throttle-w) + 16px) / -2);
  background-image: var(--ui-throttle-frame, none);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  pointer-events: none;
}

.throttle-label {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
  pointer-events: none;
}
.throttle-label.textured {
  width: var(--throttle-w);
  height: 16px;
  font-size: 0;
  color: transparent;
  text-shadow: none;
  background-image: var(--ui-throttle-label);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* =========================================================================
   RESPAWN BUTTON
   ========================================================================= */
#resetBtn {
  position: fixed;
  right: calc(16px + var(--safe-r));
  top: calc(84px + var(--safe-t));
  padding: 8px 14px;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: none;
  cursor: pointer;
}
#resetBtn:active {
  background: rgba(0, 0, 0, 0.55);
  border-color: var(--line-2);
}

#resetBtn.textured {
  padding: 0 12px;
  height: 44px;
  line-height: 1;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: transparent;
  border: 14px solid transparent;
  border-radius: 0;
  border-image-source: var(--ui-btn-frame, none);
  border-image-slice: 14;
  border-image-width: 14px;
  border-image-repeat: stretch;
  display: none;
  align-items: center;
  justify-content: center;
}
body.is-touch #resetBtn.textured { display: inline-flex; }
#resetBtn.textured:active {
  border-image-source: var(--ui-btn-frame-active, var(--ui-btn-frame, none));
  background: rgba(0, 0, 0, 0.15);
}
</style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <script src="models.js"></script>
  <script src="graphics.js"></script>
</body>
</html>
